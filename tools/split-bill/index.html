<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美国 AA 分账计算器｜ToolKu</title><meta name="description" content="美国 AA 分账计算器：输入账单、人数和小费比例，快速计算每个人应该支付多少钱。"><link rel="canonical" href="https://toolku.com/tools/split-bill/"><link rel="stylesheet" href="/css/site.css"></head><body data-tool="split"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">T</span>ToolKu</a><nav><a href="/">首页</a><a href="/tools/">工具导航</a></nav></header><main class="tool-shell"><article class="tool-page"><div class="breadcrumbs"><a href="/">首页</a> › 钱 & 工资</div><h1>AA 分账计算器</h1><p class="subtitle">聚餐、朋友吃饭时快速计算每人应付金额。</p><div class="tool-form"><div class="field"><label for="bill">总账单 ($)</label><input id="bill" type="number" min="0" step="0.01" value="200"></div><div class="field"><label for="people">人数</label><input id="people" type="number" min="1" step="1" value="4"></div><div class="field"><label for="tip">小费比例 (%)</label><input id="tip" type="number" min="0" max="100" value="20"></div><button class="btn" id="calculate">计算分账</button></div><div id="result" class="result"><strong>$60.00</strong><span>每人应付 · 小费 $40.00 · 总计 $240.00</span></div><div class="info"><h2>怎么使用？</h2><p>输入总账单、人数和小费比例。工具会先计算小费，再把含小费总额平均分给所有人。</p><h2>常见问题</h2><div class="faq"><h3>可以不加小费吗？</h3><p>可以，把小费比例设为 0 即可。</p></div></div><div class="tool-nav"><a href="/tools/">← 工具导航</a><a href="/tools/tip-calculator/">小费计算器</a></div></article></main><footer>ToolKu.com · 美国华人生活工具箱</footer><script src="/js/calculators.js"></script></body></html>
