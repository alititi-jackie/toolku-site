<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>存款 CD 收益计算器｜ToolKu</title><meta name="description" content="美国储蓄和 CD 收益计算器：输入本金、APY、期限和复利频率，估算利息和到期余额。"><link rel="canonical" href="https://toolku.com/tools/savings-cd/"><link rel="stylesheet" href="/css/site.css"></head><body data-tool="savings"><header class="site-header"><a class="brand" href="/">ToolKu</a><nav><a href="/">首页</a><a href="/tools/">工具导航</a></nav></header><main class="tool-shell"><article class="tool-page"><div class="breadcrumbs"><a href="/tools/">工具</a> › 钱 & 工资</div><h1>存款 / CD 收益计算器</h1><p class="subtitle">输入存款金额、APY 和期限，估算利息收益。</p><div class="tool-form"><div class="field"><label for="principal">存款本金 ($)</label><input id="principal" type="number" value="10000" min="0"></div><div class="field"><label for="apy">APY (%)</label><input id="apy" type="number" value="4.5" min="0" step="0.01"></div><div class="field"><label for="years">存款年数</label><input id="years" type="number" value="1" min="0" step="0.5"></div><div class="field"><label for="freq">每年复利次数</label><select id="freq"><option value="12" selected>12 次</option><option value="4">4 次</option><option value="1">1 次</option></select></div><button class="btn" id="calculate">计算收益</button></div><div id="result" class="result"><strong>—</strong><span>填写数据后计算</span></div><div class="note">实际 CD 收益以银行合同和 APY 为准；提前支取可能产生罚金。</div><div class="info"><h2>APY 和利息</h2><p>工具按输入的 APY 和复利频率估算最终余额。不同银行的计息方式和 CD 条款可能不同。</p></div><section class="openaa-cta"><div><div class="cta-eyebrow">🇺🇸 OpenAA · 美国华人生活入口</div><h2>工具解决问题，OpenAA 解决生活</h2><p>美国华人生活实用信息，可以继续进入 OpenAA。</p></div><a class="cta-button" href="https://openaa.com" target="_blank" rel="noopener noreferrer">进入 OpenAA →</a></section><div class="tool-nav"><a href="/tools/">← 工具导航</a><a href="/tools/compound-interest/">复利计算器</a><a href="/tools/401k-calculator/">401(k)退休</a></div></article></main><footer>ToolKu.com · 美国华人生活工具箱</f
