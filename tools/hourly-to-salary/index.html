<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美国时薪转年薪计算器｜ToolKu</title><meta name="description" content="美国时薪转年薪计算器：输入时薪、每周工作小时数和每年工作周数，快速估算税前年收入。"><link rel="canonical" href="https://toolku.com/tools/hourly-to-salary/"><link rel="stylesheet" href="/css/site.css"></head><body data-tool="hourly"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">T</span>ToolKu</a><nav><a href="/">首页</a><a href="/tools/">工具导航</a></nav></header><main class="tool-shell"><article class="tool-page"><div class="breadcrumbs"><a href="/">首页</a> › 工资</div><h1>美国时薪转年薪计算器</h1><p class="subtitle">输入时薪和工作时间，估算税前年收入。</p><div class="tool-form"><div class="field"><label for="hourly">时薪 ($)</label><input id="hourly" type="number" min="0" step="0.01" value="25"></div><div class="field"><label for="hours">每周工作小时</label><input id="hours" type="number" min="0" max="168" value="40"></div><div class="field"><label for="weeks">每年工作周数</label><input id="weeks" type="number" min="1" max="52" value="52"></div><button class="btn" id="calculate">计算年薪</button></div><div id="result" class="result"><strong>$52,000.00</strong><span>估算年薪税前 · 月薪约 $4,333.33</span></div><div class="info"><h2>计算公式</h2><p>年薪 = 时薪 × 每周工作小时 × 每年工作周数。加班、奖金、带薪休假和税费没有纳入。</p><h2>常见问题</h2><div class="faq"><h3>美国常见的全职工时是多少？</h3><p>很多全职岗位按每周 40 小时估算，但实际工作安排因雇主和行业而不同。</p></div></div><div class="tool-nav"><a href="/tools/">← 工具导航</a><a href="/tools/salary-calculator/">工资计算器</a></div></article></main><footer>ToolKu.com · 美国华人生活工具箱</footer><script src="/js/calculators.js"></script></body></html>
