<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美国加班工资计算器｜ToolKu</title><meta name="description" content="美国加班工资计算器：输入时薪、正常工时和加班小时数，快速估算本周税前工资。"><link rel="canonical" href="https://toolku.com/tools/overtime-pay/"><link rel="stylesheet" href="/css/site.css"></head><body data-tool="overtime"><header class="site-header"><a class="brand" href="/">ToolKu</a><nav><a href="/">首页</a><a href="/tools/">工具导航</a></nav></header><main class="tool-shell"><article class="tool-page"><div class="breadcrumbs"><a href="/tools/">工具</a> › 钱 & 工资</div><h1>美国加班工资计算器</h1><p class="subtitle">快速计算正常工资、加班工资和本周税前收入。</p><div class="tool-form"><div class="field"><label for="rate">时薪 ($)</label><input id="rate" type="number" value="20" min="0" step="0.01"></div><div class="field"><label for="hours">正常工时（小时）</label><input id="hours" type="number" value="40" min="0"></div><div class="field"><label for="ot">加班小时数</label><input id="ot" type="number" value="5" min="0"></div><button class="btn" id="calculate">计算加班工资</button></div><div id="result" class="result"><strong>—</strong><span>填写数据后计算</span></div><div class="note">按 1.5 倍时薪估算加班工资；实际加班规则应以雇佣合同及适用法律为准。</div><div class="info"><h2>怎么算？</h2><p>正常工资 = 时薪 × 正常工时；加班工资 = 时薪 × 1.5 × 加班小时数。</p></div><section class="openaa-cta"><div><div class="cta-eyebrow">🇺🇸 OpenAA · 美国华人生活入口</div><h2>工具解决问题，OpenAA 解决生活</h2><p>找工作和招聘信息，可以继续进入 OpenAA。</p></div><a class="cta-button" href="https://openaa.com/jobs" target="_blank" rel="noopener noreferrer">进入 OpenAA →</a></section><div class="tool-nav"><a href="/tools/">← 工具导航</a><a href="/tools/take-home-pay/">税后工资</a><a href="/tools/hourly-to-salary/">时薪转年薪</a></div></article></main><footer>ToolKu.com · 美国华人生活工具箱</footer><script src="/js/calculators.js"></script><script src="/js/new-calculators.js"></script></body></html>
