<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复利计算器｜美国投资储蓄工具｜ToolKu</title><meta name="description" content="复利计算器：输入本金、定期投入、年回报率和投资年数，估算未来金额和利息。"><link rel="canonical" href="https://toolku.com/tools/compound-interest/"><link rel="stylesheet" href="/css/site.css"></head><body data-tool="compound"><header class="site-header"><a class="brand" href="/">ToolKu</a><nav><a href="/">首页</a><a href="/tools/">工具导航</a></nav></header><main class="tool-shell"><article class="tool-page"><div class="breadcrumbs"><a href="/tools/">工具</a> › 钱 & 工资</div><h1>复利计算器</h1><p class="subtitle">本金加定期投入，快速估算长期复利增长。</p><div class="tool-form"><div class="field"><label for="principal">初始本金 ($)</label><input id="principal" type="number" value="10000" min="0"></div><div class="field"><label for="contribution">每期追加 ($)</label><input id="contribution" type="number" value="500" min="0"></div><div class="field"><label for="rate">年回报率 (%)</label><input id="rate" type="number" value="7" min="0" step="0.1"></div><div class="field"><label for="years">投资年数</label><input id="years" type="number" value="20" min="0"></div><div class="field"><label for="freq">每年复利次数</label><select id="freq"><option value="12" selected>12 次</option><option value="4">4 次</option><option value="1">1 次</option></select></div><button class="btn" id="calculate">计算复利</button></div><div id="result" class="result"><strong>—</strong><span>填写数据后计算</span></div><div class="info"><h2>复利是什么？</h2><p>收益继续参与下一期增长，长期投资时“收益再投资”会产生复利效果。实际投资回报并不会固定。</p></div><section class="openaa-cta"><div><div class="cta-eyebrow">🇺🇸 OpenAA · 美国华人生活入口</div><h2>工具解决问题，OpenAA 解决生活</h2><p>美国华人生活信息，可以继续进入 OpenAA。</p></div><a class="cta-button" href="https://openaa.com" target="_blank" rel="noopener noreferrer">进入 OpenAA →</a></section><div class="tool-nav"><a href="/tools/">← 工具导航</a><a href="/tools/401k-calculator/">401(k)退休</a><a href="/tools/savings-cd/">存款/CD收益</a></div></art
