<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>401(k)退休计算器｜ToolKu</title><meta name="description" content="美国401(k)退休计算器：根据工资、个人缴款、公司匹配、投资回报率和年限估算退休账户余额。"><link rel="canonical" href="https://toolku.com/tools/401k-calculator/"><link rel="stylesheet" href="/css/site.css"></head><body data-tool="retire"><header class="site-header"><a class="brand" href="/">ToolKu</a><nav><a href="/">首页</a><a href="/tools/">工具导航</a></nav></header><main class="tool-shell"><article class="tool-page"><div class="breadcrumbs"><a href="/tools/">工具</a> › 钱 & 工资</div><h1>401(k) 退休计算器</h1><p class="subtitle">估算长期缴款和公司 Match 后的退休账户余额。</p><div class="tool-form"><div class="field"><label for="salary">年薪 ($)</label><input id="salary" type="number" value="60000" min="0"></div><div class="field"><label for="contribution">个人缴款 (%)</label><input id="contribution" type="number" value="6" min="0" step="0.1"></div><div class="field"><label for="match">公司 Match (%)</label><input id="match" type="number" value="3" min="0" step="0.1"></div><div class="field"><label for="rate">预计年回报 (%)</label><input id="rate" type="number" value="7" min="0" step="0.1"></div><div class="field"><label for="years">投资年数</label><input id="years" type="number" value="25" min="0"></div><button class="btn" id="calculate">计算退休金额</button></div><div id="result" class="result"><strong>—</strong><span>填写数据后计算</span></div><div class="note">仅为复利估算，不考虑工资增长、税务、费用、通胀、缴款上限和市场波动。</div><div class="info"><h2>怎么算？</h2><p>工具把个人缴款和公司匹配视为每年投入，并按月复利估算长期账户价值。</p></div><section class="openaa-cta"><div><div class="cta-eyebrow">🇺🇸 OpenAA · 美国华人生活入口</div><h2>工具解决问题，OpenAA 解决生活</h2><p>美国工作、招聘和华人生活信息，可以继续进入 OpenAA。</p></div><a class="cta-button" href="https://openaa.com/jobs" target="_blank" rel="noopener noreferrer">进入 OpenAA →</a></section><div class="tool-nav"><a href="/tools/">← 工具导航</a><a href="/tools/compound-interest/">复利计算器</a><a href="/tools/savings-cd/">存款/CD收益</a></div></article></main><footer>ToolKu.com · 美国华人生活工具箱</footer><script src="/js/calculators.js"></script><script src="/js/new-calculators.js"></script></body></html>
