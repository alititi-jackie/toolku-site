<script>
const PLACES=[

  {category:'景点',name:'DUMBO 经典拍照点',address:'Washington St & Water St, Brooklyn, NY 11201'},
  {category:'景点',name:'法拉盛草原可乐娜公园',address:'Flushing Meadows Corona Park, Queens, NY 11368'},
  {category:'景点',name:'Roosevelt Island',address:'Roosevelt Island, New York, NY 10044'},
  {category:'景点',name:'Coney Island',address:'Coney Island Boardwalk, Brooklyn, NY 11224'},

  {category:'购物',name:'American Dream',address:'1 American Dream Way, East Rutherford, NJ 07073'},
  {category:'购物',name:'Roosevelt Field',address:'630 Old Country Rd, Garden City, NY 11530'},
  {category:'购物',name:'Queens Center',address:'90-15 Queens Blvd, Elmhurst, NY 11373'},
  {category:'购物',name:'The Shops at Hudson Yards',address:'20 Hudson Yards, New York, NY 10001'},
  {category:'购物',name:'Westfield World Trade Center',address:'185 Greenwich St, New York, NY 10007'},
  {category:'购物',name:'Woodbury Common Premium Outlets',address:'498 Red Apple Ct, Central Valley, NY 10917'},
  {category:'购物',name:'The Mills at Jersey Gardens',address:'651 Kapkowski Rd, Elizabeth, NJ 07201'},

  {category:'品牌店',name:'Gucci Fifth Avenue',address:'725 Fifth Ave, New York, NY 10022'},
  {category:'品牌店',name:'Tiffany & Co. The Landmark',address:'727 Fifth Ave, New York, NY 10022'},
  {category:'品牌店',name:'Cartier Fifth Avenue Mansion',address:'653 Fifth Ave, New York, NY 10022'},
  {category:'品牌店',name:'Hermès Madison Avenue',address:'706 Madison Ave, New York, NY 10065'},
  {category:'品牌店',name:'Prada Fifth Avenue',address:'724 Fifth Ave, New York, NY 10019'},
  {category:'品牌店',name:'CHANEL 57th Street',address:'15 E 57th St, New York, NY 10022'},

  {category:'实用',name:'7大道地铁口',address:'Seventh Avenue & 62nd Street Brooklyn, NY 11220'},
  {category:'实用',name:'36街地铁口',address:'36th Street & Fourth Avenue Brooklyn, NY 11232'},
  {category:'实用',name:'36街 Costco',address:'976 3rd Ave Brooklyn, NY 11232'}
];
const CATEGORY_LABELS={景点:'景点',购物:'购物商场',品牌店:'品牌直营店',实用:'实用地点'};
const list=document.getElementById('placeList'),search=document.getElementById('searchInput'),count=document.getElementById('countText'),shareBtn=document.getElementById('shareBtn'),installBtn=document.getElementById('installBtn'),installHelp=document.getElementById('installHelp'),categoryTabs=document.getElementById('categoryTabs');let installPrompt=null,activeCategory='all';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function mapUrl(a){const q=encodeURIComponent(a);if(/Android/i.test(navigator.userAgent))return `geo:0,0?q=${q}`;if(/iPad|iPhone|iPod/.test(navigator.userAgent))return `https://maps.apple.com/?q=${q}`;return `https://www.google.com/maps/search/?api=1&query=${q}`}
function openMap(address){const u=mapUrl(address);u.startsWith('geo:')?location.href=u:window.open(u,'_blank','noopener,noreferrer')}
async function copyText(v){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(v);return true}}catch(e){}const t=document.createElement('textarea');t.value=v;t.style.position='fixed';t.style.top='-9999px';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();return ok}
function render(){const q=search.value.trim().toLowerCase();const items=PLACES.filter(x=>(activeCategory==='all'||x.category===activeCategory)&&(!q||x.name.toLowerCase().includes(q)||x.address.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)));count.textContent=activeCategory==='all'?`${items.length} 个地点`:`${CATEGORY_LABELS[activeCategory]} · ${items.length} 个`;list.innerHTML=items.length?items.map(x=>`<article class="nyc-card" role="link" tabindex="0" data-map="${esc(x.address)}"><div class="nyc-card-inner"><div class="nyc-title-row"><div class="nyc-name">${esc(x.name)}</div><button class="nyc-copy" type="button" data-copy="${esc(x.address)}">复制</button></div><div class="nyc-address">${esc(x.address)}</div><span class="nyc-category">${esc(CATEGORY_LABELS[x.category]||x.category)}</span></div></article>`).join(''):'<div class="nyc-empty">没有找到相关地点</div>'}
categoryTabs.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;activeCategory=b.dataset.category;categoryTabs.querySelectorAll('.nyc-tab').forEach(x=>x.classList.toggle('active',x===b));render()});
list.addEventListener('click',async e=>{const c=e.target.closest('[data-copy]');if(c){e.preventDefault();e.stopPropagation();const old=c.textContent;c.textContent=await copyText(c.dataset.copy)?'已复制':'复制失败';setTimeout(()=>c.textContent=old,1400);return}const card=e.target.closest('.nyc-card[data-map]');if(card)openMap(card.dataset.map)});
list.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const card=e.target.closest('.nyc-card[data-map]');if(!card||e.target.closest('[data-copy]'))return;e.preventDefault();openMap(card.dataset.map)});
search.addEventListener('input',render);
shareBtn.addEventListener('click',async()=>{const d={title:'纽约景点购物地址导航｜ToolKu',text:'纽约景点 · 购物商场 · 品牌直营店 · 实用地点',url:location.href};if(navigator.share){try{await navigator.share(d);return}catch(e){}}alert(await copyText(location.href)?'链接已复制':'请手动复制地址栏链接')});
function isInstalled(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function showHelp(text){installHelp.textContent=text;installHelp.style.display='block';installHelp.scrollIntoView({behavior:'smooth',block:'center'})}
if(isInstalled()){installBtn.textContent='已安装到桌面';installBtn.disabled=true}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.textContent='下载到桌面';installBtn.disabled=false});
window.addEventListener('appinstalled',()=>{installPrompt=null;installBtn.textContent='已安装到桌面';installBtn.disabled=true;installHelp.style.display='none'});
installBtn.addEventListener('click',async()=>{
  if(isInstalled()){installBtn.textContent='已安装到桌面';installBtn.disabled=true;return}
  if(installPrompt){installPrompt.prompt();try{await installPrompt.userChoice}catch(e){}installPrompt=null;return}
  const ua=navigator.userAgent;
  if(/iPad|iPhone|iPod/.test(ua)){showHelp('iPhone / iPad：点击 Safari 底部“分享”按钮，再选择“添加到主屏幕”。');return}
  if(/Android/i.test(ua)){showHelp('Android：点击 Chrome 右上角菜单，再选择“安装应用”或“添加到主屏幕”。');return}
  if(/Edg\//.test(ua)){showHelp('Edge：点击右上角“…” → 应用 → 将此站点安装为应用。');return}
  if(/Chrome\//.test(ua)){showHelp('Chrome：如果没有弹出安装窗口，请点击地址栏右侧的安装图标；或右上角“⋮” → 投放、保存和分享 → 将网页安装为应用。');return}
  showHelp('当前浏览器没有提供直接安装提示。可使用浏览器菜单中的“安装应用”“添加到主屏幕”或“创建快捷方式”。')
});
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
render();
</script>
