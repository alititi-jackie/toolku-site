  <script>
    const PLACES=[
      {name:'中央公园 Central Park',address:'Columbus Circle, New York, NY 10019'},
      {name:'时代广场 Times Square',address:'Times Square, New York, NY 10036'},
      {name:'自由女神 / Battery Park',address:'Battery Park, New York, NY 10004'},
      {name:'华尔街铜牛 Charging Bull',address:'Bowling Green, New York, NY 10004'},
      {name:'世贸中心 / 9·11 纪念馆',address:'180 Greenwich St, New York, NY 10007'},
      {name:'布鲁克林大桥 Brooklyn Bridge',address:'Brooklyn Bridge, New York, NY 10038'},
      {name:'DUMBO 经典拍照点',address:'Washington St & Water St, Brooklyn, NY 11201'},
      {name:'法拉盛草原可乐娜公园',address:'Flushing Meadows Corona Park, Queens, NY 11368'},
      {name:'Roosevelt Island',address:'Roosevelt Island, New York, NY 10044'},
      {name:'Coney Island',address:'Coney Island Boardwalk, Brooklyn, NY 11224'}
      { name: "7大道地铁口", address: "Seventh Avenue & 62nd Street Brooklyn, NY 11220" },       
      { name: "36街地铁口", address: "36th Street & Fourth Avenue Brooklyn, NY 11232" }, 
      { name: "36街 Costco", address: "976 3rd Ave Brooklyn, NY 11232" },
    ];
    const list=document.getElementById('placeList'),search=document.getElementById('searchInput'),count=document.getElementById('countText'),shareBtn=document.getElementById('shareBtn'),installBtn=document.getElementById('installBtn'),iosTip=document.getElementById('iosTip');let installPrompt=null;
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function mapUrl(a){const q=encodeURIComponent(a);if(/Android/i.test(navigator.userAgent))return `geo:0,0?q=${q}`;if(/iPad|iPhone|iPod/.test(navigator.userAgent))return `https://maps.apple.com/?q=${q}`;return `https://www.google.com/maps/search/?api=1&query=${q}`}
    function openMap(address){const u=mapUrl(address);u.startsWith('geo:')?location.href=u:window.open(u,'_blank','noopener,noreferrer')}
    async function copyText(v){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(v);return true}}catch(e){}const t=document.createElement('textarea');t.value=v;t.style.position='fixed';t.style.top='-9999px';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();return ok}
    function render(){const q=search.value.trim().toLowerCase();const items=PLACES.filter(x=>!q||x.name.toLowerCase().includes(q)||x.address.toLowerCase().includes(q));count.textContent=`${items.length} 个景点`;list.innerHTML=items.length?items.map(x=>`<article class="nyc-card" role="link" tabindex="0" data-map="${esc(x.address)}"><div class="nyc-card-inner"><div class="nyc-title-row"><div class="nyc-name">${esc(x.name)}</div><button class="nyc-copy" type="button" data-copy="${esc(x.address)}" aria-label="复制地址">复制</button></div><div class="nyc-address">${esc(x.address)}</div></div></article>`).join(''):'<div class="nyc-empty">没有找到相关景点</div>'}
    list.addEventListener('click',async e=>{const c=e.target.closest('[data-copy]');if(c){e.preventDefault();e.stopPropagation();const old=c.textContent;c.textContent=await copyText(c.dataset.copy)?'已复制':'复制失败';setTimeout(()=>c.textContent=old,1400);return}const card=e.target.closest('.nyc-card[data-map]');if(card)openMap(card.dataset.map)});
    list.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const card=e.target.closest('.nyc-card[data-map]');if(!card||e.target.closest('[data-copy]'))return;e.preventDefault();openMap(card.dataset.map)});
    search.addEventListener('input',render);
    shareBtn.addEventListener('click',async()=>{const d={title:'纽约景点地址导航｜ToolKu',text:'纽约及周边华人常去景点 · 地址 · 导航',url:location.href};if(navigator.share){try{await navigator.share(d);return}catch(e){}}alert(await copyText(location.href)?'链接已复制':'请手动复制地址栏链接')});
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
    installBtn.addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}if(/iPad|iPhone|iPod/.test(navigator.userAgent)){iosTip.style.display='block';iosTip.scrollIntoView({behavior:'smooth',block:'center'});return}alert('请使用浏览器菜单中的“安装应用”或“创建快捷方式”添加到桌面。')});
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    render();
  </script>
