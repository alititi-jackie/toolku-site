name: ToolKu USA SEO brand cleanup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebrand USA SEO metadata
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          pages = {
            'usa/dmv/6-points-calculator.html': ('纽约 DMV 6 Points 计算器｜驾照 Learner Permit 文件积分检查｜ToolKu','纽约 DMV 6 Points 计算器，按纽约 DMV ID-44 文件规则，帮你快速检查申请 Learner Permit、驾照或 REAL ID 前是否已凑够 6 分身份证明。'),
            'usa/dmv/document-checker.html': ('纽约 DMV 文件检查器｜驾照与 REAL ID 材料清单｜ToolKu','纽约 DMV 文件检查器，帮助华人准备 Learner Permit、驾照和 REAL ID 所需的身份证明、SSN、地址证明等材料。'),
            'usa/dmv/real-id-checker.html': ('纽约 REAL ID 文件检查器｜DMV 材料清单｜ToolKu','纽约 REAL ID 文件检查器，帮助你检查身份、SSN、合法身份和地址证明等常见 DMV 材料是否准备齐全。'),
            'usa/dmv/real-id-vs-standard-vs-enhanced.html': ('纽约驾照 REAL ID vs Standard vs Enhanced｜ToolKu','比较纽约 REAL ID、Standard 和 Enhanced ID 的用途、材料和使用场景，帮助你选择适合自己的纽约驾照或身份证。'),
            'usa/usd-rmb/index.html': ('美元人民币汇率换算｜USD CNY 美国华人换算器｜ToolKu','美元人民币在线换算器，适合美国华人快速估算 USD 与 CNY 金额，并查看常用换算结果。'),
            'usa/expense-record/index.html': ('美国生活收支记录工具｜收入支出记录｜ToolKu','美国生活收支记录工具，帮助记录收入、支出和日常开销，适合美国工作与家庭生活使用。'),
          }
          for fn,(title,desc) in pages.items():
            p=Path(fn)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'<title>.*?</title>',f'<title>{title}</title>',s,count=1,flags=re.S)
            s=re.sub(r'(<meta name="description" content=")[^"]*(")',rf'\g<1>{desc}\2',s,count=1)
            s=re.sub(r'(<meta property="og:title" content=")[^"]*(")',rf'\g<1>{title}\2',s,count=1)
            s=re.sub(r'(<meta name="twitter:title" content=")[^"]*(")',rf'\g<1>{title}\2',s,count=1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usa
          git diff --cached --quiet && exit 0
          git commit -m "seo: make USA tools ToolKu-owned metadata"
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/toolku-usa-brand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/toolku-usa-brand.yml
          git diff --cached --quiet || { git commit -m "chore: remove one-time USA SEO workflow"; git push; }
