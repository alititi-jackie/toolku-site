name: ToolKu internal link upgrade

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade tool navigation and CTAs
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          related = {
            'tip-calculator': [('sales-tax','Sales Tax 计算器'),('split-bill','AA 分账计算器'),('discount','折扣计算器')],
            'salary-calculator': [('hourly-to-salary','时薪转年薪'),('car-payment','汽车月供计算器'),('mortgage','房贷月供计算器')],
            'hourly-to-salary': [('salary-calculator','工资计算器'),('tip-calculator','小费计算器'),('car-payment','汽车月供计算器')],
            'split-bill': [('tip-calculator','小费计算器'),('sales-tax','Sales Tax 计算器'),('discount','折扣计算器')],
            'sales-tax': [('discount','折扣计算器'),('tip-calculator','小费计算器'),('currency','美元人民币换算')],
            'discount': [('sales-tax','Sales Tax 计算器'),('currency','美元人民币换算'),('split-bill','AA 分账计算器')],
            'currency': [('sales-tax','Sales Tax 计算器'),('china-us-time','中美时间转换'),('usd-rmb','美元人民币换算（美国生活版）')],
            'temperature': [('weight','磅公斤换算'),('length','英寸厘米换算'),('volume','加仑升换算')],
            'weight': [('length','英寸厘米换算'),('volume','加仑升换算'),('temperature','华氏度摄氏度换算')],
            'length': [('area','平方英尺平方米换算'),('weight','磅公斤换算'),('distance','英里公里换算')],
            'distance': [('length','英寸厘米换算'),('mpg','MPG 油耗换算'),('gas-cost','加油成本计算器')],
            'area': [('mortgage','房贷月供计算器'),('length','英寸厘米换算'),('mattress-size','美国床垫尺寸')],
            'volume': [('weight','磅公斤换算'),('temperature','华氏度摄氏度换算'),('gas-cost','加油成本计算器')],
            'mpg': [('gas-cost','加油成本计算器'),('distance','英里公里换算'),('car-payment','汽车月供计算器')],
            'gas-cost': [('mpg','MPG 油耗换算'),('distance','英里公里换算'),('car-payment','汽车月供计算器')],
            'car-payment': [('gas-cost','加油成本计算器'),('mpg','MPG 油耗换算'),('mortgage','房贷月供计算器')],
            'mortgage': [('area','平方英尺平方米换算'),('salary-calculator','工资计算器'),('car-payment','汽车月供计算器')],
            'china-us-time': [('age','年龄计算器'),('date-difference','日期差计算器'),('currency','美元人民币换算')],
            'age': [('date-difference','日期差计算器'),('china-us-time','中美时间转换'),('shoe-size','中美鞋码转换')],
            'date-difference': [('age','年龄计算器'),('china-us-time','中美时间转换'),('mortgage','房贷月供计算器')],
            'shoe-size': [('mattress-size','美国床垫尺寸'),('length','英寸厘米换算'),('weight','磅公斤换算')],
            'mattress-size': [('area','平方英尺平方米换算'),('length','英寸厘米换算'),('shoe-size','中美鞋码转换')],
            'psi-bar': [('hp-kw','HP kW 马力千瓦换算'),('mpg','MPG 油耗换算'),('weight','磅公斤换算')],
            'hp-kw': [('psi-bar','PSI Bar 压力换算'),('car-payment','汽车月供计算器'),('mpg','MPG 油耗换算')],
          }
          cta = {
            'tip-calculator': ('openaa.com/services','附近餐厅、外卖、理发和本地服务，可以继续在 OpenAA 查找。'),
            'salary-calculator': ('openaa.com/jobs','算完工资后，可以继续在 OpenAA 查看美国华人招聘和求职信息。'),
            'hourly-to-salary': ('openaa.com/jobs','换算时薪年薪后，可以继续在 OpenAA 查看招聘和求职信息。'),
            'split-bill': ('openaa.com/services','分账之后，如果需要餐厅、外卖或本地生活服务，可以继续使用 OpenAA。'),
            'sales-tax': ('openaa.com/secondhand','购物时也可以看看 OpenAA 的二手闲置，比较价格后再决定。'),
            'discount': ('openaa.com/secondhand','算完折扣后，可以继续看看 OpenAA 的二手闲置和本地生活信息。'),
            'currency': ('openaa.com','如果你正在美国生活或工作，OpenAA 可以继续帮你找工作、房屋、二手和本地服务。'),
            'temperature': ('openaa.com','美国生活中还有很多实用信息，可以继续进入 OpenAA。'),
            'weight': ('openaa.com','购物、生活和本地信息可以继续在 OpenAA 查找。'),
            'length': ('openaa.com/housing','看房、装修或测量尺寸后，可以继续在 OpenAA 查看房屋信息。'),
            'distance': ('openaa.com','出行、找房、找工作和本地生活信息，可以继续在 OpenAA 查看。'),
            'area': ('openaa.com/housing','算好面积后，可以继续在 OpenAA 查看美国华人房屋租售信息。'),
            'volume': ('openaa.com','美国生活常用工具之外，OpenAA 还提供房屋、招聘、二手和本地服务信息。'),
            'mpg': ('openaa.com/secondhand','了解车辆油耗后，可以继续在 OpenAA 查看二手车及其他二手信息。'),
            'gas-cost': ('openaa.com/secondhand','算完用车成本后，可以继续在 OpenAA 查看二手车和本地生活信息。'),
            'car-payment': ('openaa.com/secondhand','算完汽车月供后，可以继续在 OpenAA 查看二手车和美国华人生活信息。'),
            'mortgage': ('openaa.com/housing','算完月供后，可以继续在 OpenAA 查看美国华人房屋租售信息。'),
            'china-us-time': ('openaa.com','中美生活、工作和信息交流，还可以继续使用 OpenAA。'),
            'age': ('openaa.com','如果你正在美国生活，OpenAA 提供招聘、房屋、二手、DMV 和本地服务信息。'),
            'date-difference': ('openaa.com','日期计算之外，美国华人生活信息可以继续在 OpenAA 查找。'),
            'shoe-size': ('openaa.com/secondhand','买鞋或处理闲置物品时，可以继续看看 OpenAA 二手信息。'),
            'mattress-size': ('openaa.com/secondhand','购买家具或处理闲置物品时，可以继续看看 OpenAA 二手信息。'),
            'psi-bar': ('openaa.com/services','汽车、设备维修和本地技术服务，可以继续在 OpenAA 查找。'),
            'hp-kw': ('openaa.com/services','汽车、电机和设备相关的本地服务，可以继续在 OpenAA 查找。'),
          }
          for slug, links in related.items():
              path = Path('tools') / slug / 'index.html'
              if not path.exists(): continue
              text = path.read_text(encoding='utf-8')
              nav_links = ['<a href="/tools/">← 工具导航</a>']
              for target, label in links:
                  href = '/usa/usd-rmb/' if target == 'usd-rmb' else f'/tools/{target}/'
                  nav_links.append(f'<a href="{href}">{label}</a>')
              nav = '<div class="tool-nav" aria-label="相关工具">' + ''.join(nav_links) + '</div>'
              pattern = r'<div class="tool-nav"[^>]*>.*?</div>'
              text = re.sub(pattern, nav, text, count=1, flags=re.S) if re.search(pattern, text, flags=re.S) else text.replace('</article>', nav + '</article>', 1)
              href, desc = cta[slug]
              cta_html = '<section class="openaa-cta"><div><div class="cta-eyebrow">🇺🇸 OpenAA · 美国华人生活入口</div><h2>工具解决问题，OpenAA 解决生活</h2><p>' + desc + '</p></div><a class="cta-button" href="https://' + href + '" target="_blank" rel="noopener noreferrer">进入 OpenAA →</a></section>'
              cta_pattern = r'<section class="openaa-cta">.*?</section>'
              text = re.sub(cta_pattern, cta_html, text, count=1, flags=re.S) if re.search(cta_pattern, text, flags=re.S) else text.replace('</article>', cta_html + '</article>', 1)
              path.write_text(text, encoding='utf-8')
          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              s = sitemap.read_text(encoding='utf-8')
              if '<lastmod>' in s: s = re.sub(r'<lastmod>[^<]+</lastmod>', '<lastmod>2026-09-06</lastmod>', s)
              else: s = s.replace('</loc>', '</loc><lastmod>2026-09-06</lastmod>')
              sitemap.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools sitemap.xml
          git rm .github/workflows/toolku-internal-links.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: strengthen tool internal linking and OpenAA funnel"
          git push