name: Build and deploy ToolKu to Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed revision and critical routes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = 'https://toolku.com'
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + '/release.json?rev=' + os.environ['EXPECTED_SHA'], timeout=20) as response:
                      release = json.load(response)
                  if release['commit'] == os.environ['EXPECTED_SHA']:
                      break
              except Exception as error:
                  print(error)
              time.sleep(10)
          else:
              raise SystemExit('Production revision not updated')
          for path in ['/', '/image-generic/resize/', '/pdf/split-pdf/', '/favicon.svg', '/locales/zh/translation.json', '/sitemap.xml']:
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  assert response.status == 200, path
                  assert response.read(), path
              print('OK', path)
          PY
