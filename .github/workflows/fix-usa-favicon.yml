name: Fix USA favicon and clean unused favicon assets

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: USA favicon and remove unused favicon assets'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix USA favicon paths
        shell: bash
        run: |
          set -euo pipefail
          for f in usa/dmv/*.html usa/expense-record/index.html usa/usd-rmb/index.html; do
            [ -f "$f" ] || continue
            sed -i 's#href="/favicon\.ico"#href="/favicon/favicon.ico"#g' "$f"
            sed -i 's#href="/favicon/apple-touch-icon\.png"#href="/favicon/apple-touch-icon.png"#g' "$f"
          done

      - name: Remove unused favicon assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            favicon/android-chrome-192x192.png \
            favicon/android-chrome-512x512.png \
            favicon/favicon-16x16.png \
            favicon/favicon-32x32.png \
            favicon/site.webmanifest

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usa/dmv/*.html usa/expense-record/index.html usa/usd-rmb/index.html favicon/
          git add -u
          git rm -f .github/workflows/fix-usa-favicon.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: USA favicon and remove unused favicon assets"
          git push
